name: Roomsmith
options:
  bundleIdPrefix: com.galmadar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Language mode 5 on purpose: Swift 6 strict concurrency is a fight worth
    # picking later, not while the app is still finding its shape.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"

configFiles: {}

targets:
  Roomsmith:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Roomsmith
        # Without these the plist carries literal versions that silently outrank
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION and never change.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # No encryption of our own — only OS-provided TLS, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scanning a room uses the camera and the depth sensor.
        # Reaching the design service while it runs on a Mac on the same wifi.
        NSLocalNetworkUsageDescription: Finding the design service running on your Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.galmadar.roomdesigner
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
